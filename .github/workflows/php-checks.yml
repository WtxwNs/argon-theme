name: PHP handler checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test handlers
        run: python3 -m unittest discover -s tests -v
